name: Lint and Test Charts

on:
  pull_request:
  push:
    branches:
      - main
  # 手工触发走**与 push 完全相同**的路径(kind + 镜像预载 + 真实安装冒烟):
  # PR 路径不跑预载(缺镜像凭据/太慢),于是"预载本身坏了"在 PR 上无人能看见——
  # 2026-11-03 起连续 10 次红正是这样潜伏的。有了这个入口,改预载逻辑可以先在
  # 分支上全路径验证一遍再合并。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.x'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      # ── shell 脚本门禁（shfmt 格式 + shellcheck 正确性）────────────────────
      # 为什么现在才有：2026-11-18 实测 ci/drill/ 五个脚本**全部**不合 shfmt
      # （shfmt -l -i 2 -ci 全量点名），而本仓此前**没有任何格式门禁**
      # （Lint and Test Charts 一直是绿的）⇒ 格式基线持续漂移，review 里排版噪声
      # 淹没逻辑 diff。同一批脚本还把灰度目标版本**写死**成 5.7.0 ⇒ 演练永远对着
      # 老版本打。两件事一起治：格式一次拉干净 + 本门禁防回潮。
      #
      # 为什么放这一档（重活之前）：kind 集群 + 镜像预载要十几分钟；格式/正确性问题
      # 应当秒级暴露，不该让 PR 白等 runner 额度。
      #
      # 口径与生态 hub 仓 scripts/check-shfmt.sh 同款：
      #   · shfmt -i 2 -ci，版本**钉死 v3.14.1**（不同 minor 输出可能不同 ⇒
      #     浮动版本会让门禁时红时绿）；
      #   · shellcheck -x，0 告警；
      #   · --selfcheck：门禁自证（负对照）——干净⇒绿、注入格式漂移⇒红并点名、
      #     注入 shellcheck 错误⇒红并点名、还原⇒绿、零覆盖⇒红。
      - name: Shell lint gate (shfmt -i 2 -ci + shellcheck) — 含负对照自证
        run: |
          set -uo pipefail
          go version
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
          export PATH="$(go env GOPATH)/bin:$PATH"
          shfmt --version
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --version | head -2
          bash ci/drill/lint-shell-scripts.sh --selfcheck

      # ── 镜像引用形态门禁（04 灰度回滚场景）────────────────────────────
      # 为什么要这道门禁：2026-11-18 夜间演练红实录——04 场景把
      #   drill_server_image 的**完整引用**（repo:tag）又拼了一个 ":$TAG_NEXT"
      # ⇒ 得到 ghcr.io/pigeonbox/server:6.8.0:6.9.0 这种**非法引用**
      # ⇒ 镜像预载必失败 ⇒ 演练红。可错误文案是「镜像拉取失败: …」，
      #   看着像「镜像没发布」，实则是**引用拼错** ⇒ 排查方向被带偏一整晚。
      # 口径：门禁从 04 **源码**里取出它真正使用的镜像引用表达式并求值
      #   （不自己重拼一份——重拼等于查自己的推导，04 改坏也不红）；
      #   --selfcheck 会把 04 改回历史缺陷形态，确认门禁能转红（判据有牙齿）。
      - name: Image reference gate (04 场景镜像引用形态) — 含负对照自证
        run: |
          set -uo pipefail
          bash ci/drill/check-image-ref.sh --selfcheck

      # PR:ct 按变更检测跑 lint+install；
      # push 到 main:ct 的变更检测以 target-branch(=HEAD) 为基线恒空,曾 0 秒空跑、
      # kind 冒烟从未真正执行(--since 对其 version-bump 检查语义也不符,0.2.7 误报)——
      # 故 push 改为下方显式 helm 安装冒烟,零隐式行为。
      - name: Run chart-testing (list-changed)
        id: list-changed
        if: github.event_name == 'pull_request'
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: github.event_name == 'pull_request' && steps.list-changed.outputs.changed == 'true'
        run: ct lint --target-branch ${{ github.event.repository.default_branch }}

      # 反代体积上限断言（2026-10-26 审计 P1）：chart 默认值此前是 1024m，
      # 而全生态早已统一抬到 8192m ⇒ Helm 用户按默认值部署 = nginx 1GiB 硬顶
      # + 服务端允许 4GiB ⇒ **重演 2026-10-23 的 413 事故**（大文件传到一半
      # 被拒，业务上限形同虚设）。
      # 本断言是 charts 仓的**权威口径**（hub 的跨仓门禁只做二次确认）。
      - name: 反代体积上限必须 8192m（chart 默认值 + 渲染结果）
        run: |
          set -euo pipefail
          # ① values.yaml 的默认值
          grep -qE '^\s*clientMaxBodySize:\s*"8192m"\s*$' charts/pigeonbox/values.yaml \
            || { echo "::error::charts/pigeonbox/values.yaml 的 clientMaxBodySize 必须是 8192m"; exit 1; }
          # ② 渲染结果（前端 Deployment 的 CLIENT_MAX_BODY_SIZE env）
          out=$(helm template fcb charts/pigeonbox)
          echo "$out" | grep -q 'name: CLIENT_MAX_BODY_SIZE' \
            || { echo "::error::渲染结果里没有 CLIENT_MAX_BODY_SIZE"; exit 1; }
          echo "$out" | grep -A1 'name: CLIENT_MAX_BODY_SIZE' | grep -q 'value: "8192m"' \
            || { echo "::error::渲染出的 CLIENT_MAX_BODY_SIZE 不是 8192m"; exit 1; }
          echo "✓ 反代体积上限 = 8192m"

      - name: wait-redis carries REDISCLI_AUTH when password set
        run: |
          helm template pb charts/pigeonbox --set redis.auth.password=litmus > /tmp/rendered.yaml
          grep -A20 'name: wait-redis' /tmp/rendered.yaml | grep -q 'REDISCLI_AUTH' \
            || { echo "wait-redis 缺少 REDISCLI_AUTH（密码开启时 init 将死等）"; exit 1; }

      # #19: until 循环必须有最大重试次数——无上限时密码错/redis 挂 = init 静默死等,
      # Pod 永卡 Init 且零报错。变异负对照:去掉 `-ge 60 ... exit 1` 后本步必红(本地已验)。
      - name: wait-redis has retry cap and fails loudly
        run: |
          set -euo pipefail
          helm template pb charts/pigeonbox > /tmp/wr.yaml
          cmd=$(awk '/name: wait-redis/{f=1} f && /until redis-cli/{print; exit}' /tmp/wr.yaml)
          [ -n "$cmd" ] || { echo "::error::取不到 wait-redis 的 until 命令"; exit 1; }
          echo "$cmd" | grep -q 'ge 60' \
            || { echo "::error::wait-redis until 循环缺少最大重试次数(60)——无上限即静默死等"; exit 1; }
          echo "$cmd" | grep -q 'exit 1' \
            || { echo "::error::wait-redis 超限未响亮失败(exit 1)"; exit 1; }
          echo "✓ wait-redis 重试上限 + 响亮失败已渲染"

      # #21: DB StatefulSet 容器必须补齐收紧基线(对齐 server/redis/p2p)——
      # drop ALL 后 root 必挂(gosu/setgid EPERM,本地 docker 实测),故用镜像内 uid 直跑。
      # 变异负对照:去掉任一容器 securityContext 后本步必红(本地已验)。
      - name: db statefulsets carry hardened securityContext
        run: |
          set -euo pipefail
          helm template pb charts/pigeonbox --set mysql.enabled=true --set postgresql.enabled=true \
            --show-only templates/mysql.yaml --show-only templates/postgresql.yaml > /tmp/db.yaml
          for spec in "mysql 999" "postgresql 70"; do
            set -- $spec; db=$1; uid=$2
            # 容器块 = "- name: <db>" 到其 "image:" 行(securityContext 夹在两者之间)
            blk=$(awk -v n="- name: $db" '$0 ~ n {f=1} f{print} f && /image:/{exit}' /tmp/db.yaml)
            [ -n "$blk" ] || { echo "::error::取不到 $db 容器块"; exit 1; }
            echo "$blk" | grep -q 'runAsNonRoot: true' \
              || { echo "::error::$db 缺 runAsNonRoot"; exit 1; }
            echo "$blk" | grep -q "runAsUser: $uid" \
              || { echo "::error::$db 缺 runAsUser: $uid(镜像内 uid 直跑)"; exit 1; }
            echo "$blk" | grep -q 'allowPrivilegeEscalation: false' \
              || { echo "::error::$db 缺 allowPrivilegeEscalation: false"; exit 1; }
            echo "$blk" | grep -A1 'drop:' | grep -q 'ALL' \
              || { echo "::error::$db capabilities 未 drop ALL"; exit 1; }
          done
          grep -q 'fsGroup: 999' /tmp/db.yaml \
            || { echo "::error::mysql 缺 pod 级 fsGroup: 999(999 直跑卷不可写)"; exit 1; }
          grep -q 'fsGroup: 70' /tmp/db.yaml \
            || { echo "::error::postgresql 缺 pod 级 fsGroup: 70"; exit 1; }
          echo "✓ mysql/postgresql 收紧基线已渲染"

      # #22: p2p.adminPassword 必须落 Secret(secretKeyRef),渲染零明文——
      # 明文 value 进 Pod spec/etcd/事件流,读 Pod 的 RBAC 通常比读 Secret 宽。
      # 变异负对照: 改回 value: 明文后本步必红(本地已验)。
      - name: p2p admin password lives in secret, not pod spec
        run: |
          set -euo pipefail
          helm template pb charts/pigeonbox --set p2p.enabled=true \
            --set p2p.adminPassword=litmus > /tmp/p2p.yaml
          # b64 必须在(=落进 Secret data)
          grep -q "$(printf litmus | base64)" /tmp/p2p.yaml \
            || { echo "::error::p2p 口令未 base64 落进 Secret"; exit 1; }
          # 反向: 渲染结果任何位置不得出现明文(b64 不含原文,可安全全文 grep)
          ! grep -q 'litmus' /tmp/p2p.yaml \
            || { echo "::error::p2p 口令以明文出现在渲染结果"; exit 1; }
          # 消费方必须 secretKeyRef
          grep -A8 'name: PB_P2P_ADMIN_PASSWORD' /tmp/p2p.yaml | grep -q 'secretKeyRef' \
            || { echo "::error::PB_P2P_ADMIN_PASSWORD 未走 secretKeyRef"; exit 1; }
          echo "✓ p2p 口令走 Secret,渲染零明文"

      # #27: 显式密码轮换必须滚动 Pod——values-based checksum 注解(server+redis 双侧)。
      # 反向断言: 默认(自动生成密码)渲染**不得**有任何 redis-auth checksum——
      # 用 render 结果做 checksum 会因每次随机而每次都滚动(每条 upgrade 无谓重启)。
      # 变异负对照: 注解改回 render 结果并去掉 if 守卫后本步必红(本地已验)。
      - name: redis auth password rotation triggers rollout via values checksum
        run: |
          set -euo pipefail
          want=$(printf rotated-a | sha256sum | cut -d' ' -f1)
          helm template pb charts/pigeonbox --set redis.auth.password=rotated-a > /tmp/c1.yaml
          # 双侧(server Pod 模板 + redis Pod 模板)都必须带同一 values-based 值
          [ "$(grep -c "checksum/redis-auth: $want" /tmp/c1.yaml)" -ge 2 ] \
            || { echo "::error::server/redis 双侧缺 checksum/redis-auth(或值非 sha256(密码))"; exit 1; }
          # 同一密码两次渲染注解值恒定(值变才滚动的前提)
          helm template pb charts/pigeonbox --set redis.auth.password=rotated-a > /tmp/c2.yaml
          diff <(grep 'checksum/redis-auth' /tmp/c1.yaml) <(grep 'checksum/redis-auth' /tmp/c2.yaml) >/dev/null \
            || { echo "::error::同密码两次渲染注解不一致(非 values-based)"; exit 1; }
          # 换密码 ⇒ 注解值必须变(轮换触发滚动)
          helm template pb charts/pigeonbox --set redis.auth.password=rotated-b > /tmp/c3.yaml
          ! grep -q "checksum/redis-auth: $want" /tmp/c3.yaml \
            || { echo "::error::换密码后注解值未变(轮换不滚动)"; exit 1; }
          # 默认路径无显式密码: 不得出现任何 redis-auth checksum(防 render 随机 ⇒ 每次滚动)
          helm template pb charts/pigeonbox > /tmp/c0.yaml
          ! grep -q 'checksum/redis-auth' /tmp/c0.yaml \
            || { echo "::error::默认渲染出现 redis-auth checksum(随机渲染值会导致每次 upgrade 都滚动)"; exit 1; }
          echo "✓ 显式密码轮换滚动 + 默认路径零滚动注解"

      # #23①: 拆分模式 public/admin 双 PDB,selector 与两平面真实 Pod 标签逐字对齐
      # (选不中 Pod 的 PDB 是静默 no-op);单副本默认零 PDB(会卡死节点 drain)。
      # 变异负对照: 改错 admin selector 后本步必红(本地已验)。
      - name: pdb dual-plane selectors match real pod labels
        run: |
          set -euo pipefail
          if helm template pb charts/pigeonbox | grep -q 'kind: PodDisruptionBudget'; then
            echo "::error::单副本默认渲染出 PDB(会卡死节点 drain)"; exit 1
          fi
          helm template pb charts/pigeonbox --set replicaCount=2 --show-only templates/pdb.yaml > /tmp/pdb.yaml
          n=$(grep -c 'kind: PodDisruptionBudget' /tmp/pdb.yaml)
          [ "$n" -eq 2 ] || { echo "::error::拆分模式应渲染 public/admin 双 PDB,实得 $n"; exit 1; }
          helm template pb charts/pigeonbox --set replicaCount=2 --show-only templates/deployment.yaml > /tmp/pub.yaml
          helm template pb charts/pigeonbox --set replicaCount=2 --show-only templates/admin-plane.yaml > /tmp/adm.yaml
          pod_labels() { awk '/^  template:/{t=1} t&&/^      labels:/{g=1;next} g&&/^        [A-Za-z]/{print;next} g{exit}' "$1"; }
          pub_labels=$(pod_labels /tmp/pub.yaml); adm_labels=$(pod_labels /tmp/adm.yaml)
          [ -n "$pub_labels" ] && [ -n "$adm_labels" ] || { echo "::error::取不到两平面 Pod 标签"; exit 1; }
          # 第 1 个 PDB=public、第 2 个=admin(模板顺序固定);取各自 matchLabels 块
          sel_of() { awk -v want="$1" '/^---$/{d++;next}{if(d==0)d=1} d==want&&/^    matchLabels:/{g=1;next} d==want&&g&&/^      [a-z]/{print;next} d==want&&g{g=0}' /tmp/pdb.yaml; }
          pub_sel=$(sel_of 1); adm_sel=$(sel_of 2)
          [ -n "$pub_sel" ] && [ -n "$adm_sel" ] || { echo "::error::取不到 PDB selector"; exit 1; }
          trim() { sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          echo "$pub_sel" | trim | while IFS= read -r kv; do [ -n "$kv" ] || continue; echo "$pub_labels" | trim | grep -qxF "$kv" || { echo "::error::public PDB selector [$kv] 不在 public Pod 标签里(静默 no-op)"; exit 1; }; done
          echo "$adm_sel" | trim | while IFS= read -r kv; do [ -n "$kv" ] || continue; echo "$adm_labels" | trim | grep -qxF "$kv" || { echo "::error::admin PDB selector [$kv] 不在 admin Pod 标签里(静默 no-op)"; exit 1; }; done
          # 两平面必须靠 component 区分(否则一个 PDB 会选中两组)
          echo "$pub_sel" | grep -q 'component: server-public' || { echo "::error::public PDB selector 缺 component"; exit 1; }
          echo "$adm_sel" | grep -q 'component: server-admin' || { echo "::error::admin PDB selector 缺 component"; exit 1; }
          echo "✓ 双 PDB selector ↔ 两平面 Pod 标签已对齐"

      # #23②: 容量告警规则挂 values 开关——默认不渲染(无 Prometheus Operator CRD
      # 的集群渲染出会装不上);开启后规则必须引用真实指标。
      # 变异负对照: 去掉 if 守卫后本步必红(本地已验)。
      - name: storage alert rules behind values switch
        run: |
          set -euo pipefail
          if helm template pb charts/pigeonbox | grep -q 'kind: PrometheusRule'; then
            echo "::error::默认渲染 PrometheusRule(无 CRD 集群会安装失败)"; exit 1
          fi
          helm template pb charts/pigeonbox --set metrics.prometheusRule.enabled=true > /tmp/rule.yaml
          grep -q 'kind: PrometheusRule' /tmp/rule.yaml || { echo "::error::开关开启后未渲染"; exit 1; }
          for a in PigeonBoxPVCSpaceLow PigeonBoxPVCSpaceCritical PigeonBoxQuotaRejectionsSpike; do
            grep -q "$a" /tmp/rule.yaml || { echo "::error::缺告警规则 $a"; exit 1; }
          done
          grep -q 'kubelet_volume_stats_available_bytes' /tmp/rule.yaml \
            || { echo "::error::存储规则未引用 kubelet_volume_stats"; exit 1; }
          grep -q 'reason=~"quota|anon_quota"' /tmp/rule.yaml \
            || { echo "::error::配额规则未引用 pb_upload_rejected_total 的真实 label"; exit 1; }
          echo "✓ 容量/配额告警规则 values 开关 + 真实指标引用"

      # 默认认证:密码默认开启,单点生成进 <fullname>-redis-auth,消费方全 secretKeyRef
      # (多模板各自 randAlphaNum 会互不一致 ⇒ 明文只允许出现在 Secret 模板里)
      - name: default install renders redis auth secret + networkpolicy
        run: |
          helm template pb charts/pigeonbox > /tmp/def.yaml
          grep -q 'kind: Secret' /tmp/def.yaml || { echo "缺少默认认证 Secret"; exit 1; }
          grep -q 'redis-auth' /tmp/def.yaml || { echo "缺少 <fullname>-redis-auth Secret"; exit 1; }
          grep -q 'REDISCLI_AUTH' /tmp/def.yaml || { echo "消费方未引用认证"; exit 1; }
          grep -q 'PB_REDIS_PASSWORD' /tmp/def.yaml || { echo "消费方未注入 PB_REDIS_PASSWORD"; exit 1; }
          grep -q 'kind: NetworkPolicy' /tmp/def.yaml || { echo "缺少 NetworkPolicy"; exit 1; }
      - name: explicit password lands in secret
        run: |
          helm template pb charts/pigeonbox --set redis.auth.password=litmus > /tmp/pw.yaml
          # b64 必须出现在渲染结果(=落进了 Secret data)
          grep -q "$(printf litmus | base64)" /tmp/pw.yaml \
            || { echo "显式密码未 base64 落进 Secret"; exit 1; }
          # 反向:明文只允许活在 Secret 模板内,消费方一律 secretKeyRef
          ! grep -q '"litmus"' /tmp/pw.yaml \
            || { echo "密码以明文散落在渲染结果里(应只在 Secret data)"; exit 1; }

      # NetworkPolicy 的 podSelector/from 必须与两侧**真实 Pod 标签**逐字对齐——
      # 选不中任何 Pod 的 NetworkPolicy 是静默 no-op(渲染全绿、一条流量也没管)。
      - name: networkpolicy selectors match real pod labels
        run: |
          set -euo pipefail
          helm template pb charts/pigeonbox --show-only templates/redis.yaml > /tmp/np-redis.yaml
          helm template pb charts/pigeonbox --show-only templates/deployment.yaml > /tmp/np-srv.yaml
          helm template pb charts/pigeonbox --show-only templates/networkpolicy.yaml > /tmp/np.yaml
          # Pod 模板标签块(spec.template.metadata.labels: 6 空格 labels:,条目 8 空格)
          pod_labels() { awk '/^  template:/{t=1} t&&/^      labels:/{g=1;next} g&&/^        [A-Za-z]/{print;next} g{exit}' "$1"; }
          redis_labels=$(pod_labels /tmp/np-redis.yaml)
          srv_labels=$(pod_labels /tmp/np-srv.yaml)
          [ -n "$redis_labels" ] || { echo "::error::取不到 redis Pod 标签"; exit 1; }
          [ -n "$srv_labels" ] || { echo "::error::取不到 server Pod 标签"; exit 1; }
          # podSelector 块(第 2 个 podSelector 是 from 侧;取第 1 个)
          np_sel=$(awk '/^  podSelector:/{n++; if(n==1){f=1;next}} f&&/^    matchLabels:/{g=1;next} f&&!/^    matchLabels:/{f=0} g&&/^      /{print;next} g{exit}' /tmp/np.yaml)
          np_from=$(awk '/^        - podSelector:/{f=1;next} f&&/^            matchLabels:/{g=1;next} f&&!/^            matchLabels:/{f=0} g&&/^              /{print;next} g{exit}' /tmp/np.yaml)
          [ -n "$np_sel" ] || { echo "::error::取不到 NetworkPolicy podSelector"; exit 1; }
          [ -n "$np_from" ] || { echo "::error::取不到 NetworkPolicy from 选择器"; exit 1; }
          # 去缩进后**整行精确**匹配(子串匹配会把 pigeonbox 误判命中 pigeonbox-redis)
          trim() { sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          echo "$np_sel"  | trim | while IFS= read -r kv; do [ -n "$kv" ] || continue; echo "$redis_labels" | trim | grep -qxF "$kv" || { echo "::error::podSelector [$kv] 不在 redis Pod 标签里 ⇒ 选不中(静默 no-op)"; exit 1; }; done
          echo "$np_from" | trim | while IFS= read -r kv; do [ -n "$kv" ] || continue; echo "$srv_labels"  | trim | grep -qxF "$kv" || { echo "::error::from [$kv] 不在 server Pod 标签里 ⇒ 放行不了后端流量"; exit 1; }; done
          echo "✓ podSelector ↔ redis Pod 标签, from ↔ server Pod 标签 已对齐"

      # 多副本拆分拓扑守卫(纯渲染,无需集群):replicaCount>1 必须渲染出
      # public×N + admin×1 双平面 + admin 控制台入口链,且 server Service 只选 public 平面
      - name: Render split-mode topology (PR)
        if: github.event_name == 'pull_request'
        run: |
          out=$(helm template fcb charts/pigeonbox \
            --set replicaCount=2 --set serverAdmin.ingress.enabled=true)
          echo "$out" | grep -q 'value: "public"'
          echo "$out" | grep -q 'value: "admin"'
          echo "$out" | grep -q 'component: server-public'
          echo "$out" | grep -q 'component: server-admin'
          n=$(echo "$out" | grep -c '^kind: Deployment')
          [ "$n" -eq 5 ] || { echo "::error::拆分模式应渲染 5 个 Deployment(public/admin/frontend/admin-frontend/redis)，实得 $n"; exit 1; }
          echo "split topology OK"

      - name: Create kind cluster
        if: github.event_name != 'pull_request' || steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2

      # chart bump 与 server 打 tag 几乎同时(依赖升级提交同时触发两条流水线),
      # 多架构镜像(qemu arm64)要 10-30 分钟才 publish;kind 只等 5m,不等镜像
      # 就会 ImagePullBackOff 超时(0.2.12/0.2.13 均如此)。
      # 探测用 docker pull 重试——ghcr 的 registry HTTP API 对 runner 网段匿名
      # manifest GET 恒 401(本机同请求 200),不可用作探测;docker 拉取路径没问题。
      # 拉到后 kind load 预载,部署按 IfNotPresent 直接用,不依赖节点实时拉取。
      - name: Wait for app images & preload into kind (push)
        if: github.event_name != 'pull_request'
        run: |
          tag=$(awk '/^appVersion:/{gsub(/"/,"",$2); print $2; exit}' charts/pigeonbox/Chart.yaml)
          tag=${tag#v}
          # 前后端分离落地(chart 带 frontend-deployment)后,两镜像同版本列车都要等;
          # 两路并行等待(qemu 多架构 10-30 分钟,串行会顶到 45 分钟窗口边缘)
          images="server"
          [ -f charts/pigeonbox/templates/frontend-deployment.yaml ] && images="server frontend"
          pull_one() {
            local ref="ghcr.io/pigeonbox/$1:${tag}" i
            echo "等待 ${ref} 可拉取..."
            for i in $(seq 1 90); do
              if docker pull -q "$ref" >/dev/null 2>&1; then echo "  ✓ $ref"; return 0; fi
              sleep 30
            done
            echo "::error::${ref} 45 分钟内未发布——对应 Release 未跑或失败"
            return 1
          }
          for image in $images; do pull_one "$image" & done
          fails=0
          for j in $(jobs -p); do wait "$j" || fails=1; done
          [ "$fails" = 0 ] || exit 1
          # ⚠️ 不能用 kind load docker-image:应用镜像是**多架构 OCI index**
          # (linux/amd64 + linux/arm64,arm64 由 qemu 交叉构建),而 kind 的装载实现
          # 是 ctr images import **--all-platforms** ⇒ 它要求 index 里**每个**平台的
          # blob 都在归档内;而 docker pull 只落 runner 本平台 ⇒ 另一平台的 manifest
          # 缺失 ⇒ "content digest sha256:...: not found" ⇒ 预载失败 ⇒ release 之后的
          # kind 冒烟恒红(2026-11-03 起 10 连红,而 Release Charts 一直绿 ⇒ chart 的
          # 真机部署验证事实上停摆,5 天无人发现)。
          # 修法:自己 docker save(归档仍是完整 index)再**显式 pin 平台**导入——
          # ctr 的 --platform 只挑该平台的 manifest 解包,不要求另一平台的 blob。
          # 正反两向实测(pin 到归档里没有的平台仍报同一个 not found ⇒ 证明 --platform
          # 真的在筛,不是被忽略;pin 到有的平台 ⇒ 导入成功,kubelet 以
          # imagePullPolicy:Never 直接 "already present on machine" 起容器)。
          node=$(kind get nodes --name chart-testing | head -1)
          arch=$(uname -m); case "$arch" in x86_64) arch=amd64;; aarch64) arch=arm64;; esac
          for image in $images; do
            ref="ghcr.io/pigeonbox/${image}:${tag}"
            docker save "$ref" | docker exec -i "$node" \
              ctr --namespace=k8s.io images import --platform "linux/${arch}" \
                --digests --snapshotter=overlayfs -
            echo "  ✓ 预载 $ref (linux/${arch})"
          done

      - name: Real install smoke (push)
        if: github.event_name != 'pull_request'
        run: |
          helm lint charts/pigeonbox
          helm upgrade --install fcb charts/pigeonbox -n fcb-ci --create-namespace \
            -f charts/pigeonbox/ci/config-overlay-values.yaml --wait --timeout 5m
          kubectl -n fcb-ci rollout status deploy -l app.kubernetes.io/instance=fcb --timeout=5m
          helm test fcb -n fcb-ci

      # 内置对象存储实装验证(默认关闭,独立 namespace 验证建桶 init + PB_STORAGE_* 接线)
      # --set config.storage=null 删掉 overlay 的 config.storage 段,让内置接线真正生效
      #(显式 config.storage 存在时 chart 让位,冒烟就变成空转了)
      - name: S3 (SeaweedFS) install smoke (push)
        if: github.event_name != 'pull_request'
        run: |
          helm upgrade --install fcb-s3 charts/pigeonbox -n fcb-s3 --create-namespace \
            -f charts/pigeonbox/ci/config-overlay-values.yaml \
            --set fullnameOverride=fcb-s3 --set s3.enabled=true --set config.storage=null \
            --wait --timeout 10m
          kubectl -n fcb-s3 rollout status statefulset/fcb-s3-s3 --timeout=5m
          kubectl -n fcb-s3 rollout status deploy/fcb-s3 --timeout=10m
          kubectl -n fcb-s3 get deploy fcb-s3 -o jsonpath='{.spec.template.spec.initContainers[*].name}' | grep -q wait-s3-bucket
          helm test fcb-s3 -n fcb-s3

      # 冒烟失败时必须留下 Pod 级证据:此前三连挂时失败日志只有一行
      # "Deployment not ready 0/1",分不清是镜像未发布/init 容器卡住/探针语法哪层的问题。
      - name: Dump failure diagnostics (push)
        if: failure() && github.event_name != 'pull_request'
        run: |
          for ns in fcb-ci fcb-s3; do
            echo "════════ 命名空间 $ns ════════"
            kubectl -n "$ns" get deploy,sts,po -o wide || true
            echo '──────── events ────────'
            kubectl -n "$ns" get events --sort-by=.lastTimestamp | tail -40 || true
            for p in $(kubectl -n "$ns" get po -o name); do
              echo "──────── $p ────────"
              kubectl -n "$ns" describe "$p" | sed -n '/^Events:/,$p' || true
              # ⚠️ 不能用 `kubectl logs --init-containers`：旗标不存在 ⇒ 诊断 step 自己先炸。
              bash ci/drill/dump-pod-logs.sh "$ns" "$p" 50 || true
            done
          done

      - name: Run chart-testing (install)
        if: github.event_name == 'pull_request' && steps.list-changed.outputs.changed == 'true'
        run: ct install --target-branch ${{ github.event.repository.default_branch }}
