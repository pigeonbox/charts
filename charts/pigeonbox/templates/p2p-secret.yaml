{{- if and .Values.p2p.enabled .Values.p2p.adminPassword }}
{{/*P2P 管理端口令(#22): 明文只允许存在于本模板,消费方一律 secretKeyRef。
用 data + b64enc 而非 stringData ⇒ helm template 渲染结果零明文
(断言: 显式口令 base64 落 data、明文不得出现)。口令留空时管理 API 禁用,
故本模板与 p2p.yaml 的 env 同条件渲染,不存在悬空引用。*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pigeonbox.p2p.adminSecretName" . }}
  labels:
    {{- include "pigeonbox.data.labels" (dict "component" "p2p" "Release" .Release "Values" .Values "Chart" .Chart "Template" .Template) | nindent 4 }}
type: Opaque
data:
  admin-password: {{ .Values.p2p.adminPassword | b64enc | quote }}
{{- end }}
