{{- if .Values.redis.enabled }}
{{- /* 密码单点生成:显式值 > 集群既有 Secret(lookup,upgrade 续用) > 随机 24 位。
       lookup 仅在连着集群的 install/upgrade 生效;helm template 无集群时每次随机,
       但消费方全部 secretKeyRef,不依赖渲染期明文 ⇒ 无一致性问题。 */}}
{{- $pwd := .Values.redis.auth.password }}
{{- if not $pwd }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "pigeonbox.redis.secretName" .) }}
{{- if and $existing $existing.data (index $existing.data "password") }}
{{- $pwd = index $existing.data "password" | b64dec }}
{{- else }}
{{- $pwd = randAlphaNum 24 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pigeonbox.redis.secretName" . }}
  labels:
    {{- include "pigeonbox.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ $pwd | b64enc | quote }}
{{- end }}
